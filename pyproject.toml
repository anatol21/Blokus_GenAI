[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "blokus-focus-pokus"
version = "0.1.0"
description = "Phase 1 Blokus Classic engine and CLI in plain Python."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Project Team" }
]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
interview-simulator = [
  "requests>=2.33.0",
  "reportlab>=4.4.10",
]

[project.scripts]
blokus = "blokus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/blokus", "scripts/github"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
